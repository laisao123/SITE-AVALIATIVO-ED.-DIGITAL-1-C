<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transpô | Mobilidade Urbana Sustentável</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav class="navbar" aria-label="Navegação Principal">
            <div class="logo">Transpô</div>
            
            <div class="accessibility-controls">
                <button onclick="changeFontSize('increase')" aria-label="Aumentar fonte">A+</button>
                <button onclick="changeFontSize('decrease')" aria-label="Diminuir fonte">A-</button>
                <button id="contrast-toggle" aria-label="Alternar Alto Contraste">◐</button>
            </div>

            <ul class="nav-links">
                <li><a href="#servicos">Serviços</a></li>
                <li><a href="#faq">Dúvidas</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero scroll-reveal">
            <h1>Transporte Público: O Coração da Cidade</h1>
            <p>Conectando pessoas e destinos de forma sustentável e eficiente.</p>
        </section>

        <section id="servicos" class="container scroll-reveal">
            <h2>Nossos Serviços</h2>
            <div id="cards-container" class="grid-layout">
                </div>
        </section>

        <section class="carousel-container scroll-reveal">
            <h2>Galeria de Mobilidade</h2>
            <div class="carousel" role="region" aria-roledescription="carousel">
                <div id="carousel-track" class="carousel-track">
                    </div>
                <div class="carousel-nav">
                    <button class="carousel-btn prev" aria-label="Slide anterior">❮</button>
                    <button class="carousel-btn next" aria-label="Próximo slide">❯</button>
                </div>
            </div>
        </section>

        <section id="faq" class="container scroll-reveal">
            <h2>Perguntas Frequentes</h2>
            <div id="faq-container">
                </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Transpô - Mobilidade Urbana Acessível.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
